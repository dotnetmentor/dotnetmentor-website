name: Generate agent artifacts

on:
  push:
    paths:
      - '_data/**'
      - 'scripts/generate-agent-artifacts.py'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Regenerate agent artifacts
        run: python3 scripts/generate-agent-artifacts.py

      - name: Commit updated artifacts
        run: |
          if git diff --quiet; then
            echo "Agent artifacts already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .well-known content llms.txt cloudflare/agent-discovery.json
          git commit -m "chore: regenerate agent artifacts from _data"
          git push
